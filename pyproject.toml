[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlian-assiant"
version = "0.1.0a1"
description = "One documented Python client over every way of reading, writing and watching Jira and Confluence (independent project, not affiliated with Atlassian)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kazi Samin Yeaser" }]
keywords = ["jira", "confluence", "atlassian", "mcp", "llm", "agents", "webhooks", "graphql"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Operating System :: OS Independent",
    "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13", "Topic :: Software Development :: Libraries :: Python Modules", "Typing :: Typed"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "pydantic-settings>=2.3", "anyio>=4.4"]

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
browser = ["playwright>=1.45", "pyyaml>=6.0"]
datalake = ["delta-sharing>=1.0", "pandas>=2.2"]
duckdb = ["duckdb>=1.0"]
aws = ["boto3>=1.34"]
azure = ["azure-servicebus>=7.12"]
gcp = ["google-cloud-pubsub>=2.21"]
server = ["starlette>=0.37", "uvicorn>=0.30", "fastapi>=0.110"]
flask = ["flask>=3.0"]
jwt = ["pyjwt[crypto]>=2.8"]
rss = ["feedparser>=6.0"]
db = ["sqlalchemy>=2.0"]
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
chroma = ["chromadb>=0.5"]
weaviate = ["weaviate-client>=4.6"]
pinecone = ["pinecone>=5.0"]
redis = ["redis>=5.0"]
formats = ["markdown-it-py>=3.0", "beautifulsoup4>=4.12"]
otel = ["opentelemetry-api>=1.25"]
agent = ["anthropic>=0.40"]
slack = ["slack-sdk>=3.27"]
msgraph = ["msal>=1.28"]
twilio = ["twilio>=9.0"]
kafka = ["aiokafka>=0.11"]
tunnels = ["ngrok>=1.3"]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "respx>=0.21", "mypy>=1.10", "ruff>=0.5", "pyyaml>=6.0", "jsonschema>=4.21", "graphql-core>=3.2,<3.3", "pyjwt[crypto]>=2.8", "mcp>=1.10"]

[project.urls]
Homepage = "https://github.com/ksypinro/Atlian-Assiant"
Repository = "https://github.com/ksypinro/Atlian-Assiant"
Issues = "https://github.com/ksypinro/Atlian-Assiant/issues"
Documentation = "https://github.com/ksypinro/Atlian-Assiant/tree/main/docs"

[project.scripts]
atlian-assiant = "atlian_assiant.cli:main"

[tool.setuptools.packages.find]
include = ["atlian_assiant*"]

[tool.setuptools.package-data]
atlian_assiant = ["py.typed", "facade/*.pyi", "agent/docs/*.md", "agent/docs/*.txt", "relay/cloudflare_worker/*", "backends/graphql/queries/*.graphql", "backends/browser/selectors.yaml",
    "backends/rest_cloud/generated/operations_index.json", "backends/mcp/catalog_v2.json"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = ["F401", "F403", "F405", "I001", "UP", "E701", "B"]   # generated stubs (tools/gen_stubs.py)

[dependency-groups]
tracking = ["pydantic>=2.7", "pyyaml>=6.0", "jsonschema>=4.21", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["chromadb", "weaviate", "weaviate.*", "pinecone", "yaml", "duckdb", "delta_sharing", "pandas", "pyarrow", "sqlalchemy", "sqlalchemy.*", "fastapi", "fastapi.*", "flask", "flask.*", "boto3", "boto3.*", "azure.*", "google.*", "slack_sdk", "slack_sdk.*", "ngrok", "aiokafka", "aiokafka.*", "redis", "redis.*"]
ignore_missing_imports = true
