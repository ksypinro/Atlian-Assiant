# §14.2 cross-cutting rule -> phase
cc_phases:
  default: P3
  overrides: {CC-06: P4c, CC-12: P4, CC-13: P4, CC-14: P4}

# Workstream for DM tasks by ledger phase/kind (default EVENTS; notification methods use NOTIFY)
notify_phases: [P4b]
