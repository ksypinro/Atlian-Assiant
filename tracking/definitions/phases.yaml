# Phase gates. Scope and exit criteria mirror design section 20; checks/human items are hand-maintained.
phases:
- id: P0
  name: Core
  scope: capabilities/operations, config, transport, auth (Basic, OAuth 3LO, bearer), URL/cloudId, pagination, retry,
    errors, models, ADF/Storage formats, REST Cloud read/search for Jira + Confluence, router, presets, sync facade
  exit_criteria: Contract tests green on REST + Fake; describe()
  machine_checks:
  - pytest tests/contract -q
  - mypy --strict atlassian_client
  - python -m tools.track check-coverage
  - pytest tests/core/test_describe.py -q
  human_items:
  - Reviewer sign-off
- id: P1
  name: Agent-ready
  scope: '@agent_tool, registry, exporters, policy + confirmation + dry-run, curated READ/SEARCH tools, AGENT_GUIDE
    / llms.txt generation, MCP backend (read/search)'
  exit_criteria: A Claude tool loop answers multi-product questions using only for_agent()
  machine_checks:
  - pytest tests/agent -q
  - python -m tools.docgen --check
  - pytest tests/contract -k mcp -q
  human_items:
  - Live Claude tool-loop demo against the sandbox answers a multi-product question
- id: P2
  name: Writes
  scope: Jira/Confluence/JSM writers + deleters (REST, MCP), field/user resolvers, version-checked Confluence updates,
    per-issue serialization
  exit_criteria: Write contract suite; no-duplicate-write router tests
  machine_checks:
  - pytest tests/contract -k write -q
  - pytest tests/routing/test_no_duplicate_writes.py -q
  - pytest tests/policy -q
  human_items:
  - Security review of policy / confirmation flow (SEC tasks of the phase)
- id: P3
  name: Events I
  scope: ChangeEvent, delivery-method catalog + coverage test, normalization, stores, pipeline, enricher, WebhookUrlPreflight,
    verifiers, reconciler. Methods DM-01, 02, 03, 05, 15, 16, 36, 37, 38
  exit_criteria: Each listed method has provisioner, consumer, verifier and contract test green; a change in Jira
    reaches a handler with the canonical issue
  machine_checks:
  - pytest tests/events/test_research_coverage.py -q
  - pytest tests/events/pipeline -q
  - pytest tests/events/methods -k 'dm_01 or dm_02 or dm_03 or dm_05 or dm_15 or dm_16 or dm_36 or dm_37 or dm_38'
    -q
  human_items:
  - Live verify_dm_XX run on the sandbox for each P3 method
- id: P4
  name: Events II
  scope: Forge companion app (native / inbox / remote / realtime) + ForgeCliRunner, org audit, AWS / SSM / JEC provisioners,
    managed relays, DC webhooks, blueprints + planner, PoC harness. Methods DM-06 … 14, 17, 18, 19, 39 … 43, 46,
    47
  exit_criteria: EV §61 PoCs A–D reproducible with PocHarness; verifiers green
  machine_checks:
  - pytest tests/events/methods -q -m phase_p4
  - python -m atlassian_client.events.poc compare --offline
  human_items:
  - Credentials provisioned (AWS, Forge, org admin)
  - PoC A-D report review
  - Security review
- id: P4b
  name: Notifications
  scope: Automation templates for every action, notification schemes, custom events, watches, filter subscriptions,
    RSS, Slack, Teams, Twilio, JSM Ops, AtlassianLinkParser. Methods DM-20 … 35
  exit_criteria: A probe change produces a notification on every channel and a resolved ChangeEvent
  machine_checks:
  - pytest tests/events/methods -q -m phase_p4b
  human_items:
  - Slack/Teams/Twilio/IMAP sandbox accounts available
  - Security review
- id: P4c
  name: Legacy, transports & guards
  scope: Connect, tunnels, MCP polling transport, downstream sinks, all guards. Methods DM-04, 44, 45, 48, 49
  exit_criteria: Coverage test reports 49/49 methods and 63/63 research sections; guard tests green
  machine_checks:
  - pytest tests/events/test_research_coverage.py -q
  - pytest tests/events/methods -q -m phase_p4c
  human_items:
  - Reviewer confirms guards' hints
  - Security review
- id: P5
  name: More ways
  scope: ACLI, TWG, jira-cli, GraphQL, exports, Data Lake + DuckDB, browser backend, Data Center REST, DB (opt-in)
  exit_criteria: Support matrix fully green for the declared cells
  machine_checks:
  - pytest tests/contract/test_matrix_matches_design.py -q
  human_items:
  - Third-party CLI version pins approved
- id: P6
  name: Long tail
  scope: OpenAPI codegen tier, discover/call meta-tools, drift CI, mirror engine + vector sinks, MCP server mode,
    CLI
  exit_criteria: Operation coverage report = 100% of OpenAPI operations reachable
  machine_checks:
  - python -m tools.codegen --check-reachability
  - python -m tools.docgen --check
  - pytest tests/agent/test_mcp_server.py -q
  human_items:
  - Release sign-off
